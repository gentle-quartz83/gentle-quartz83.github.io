<h1>Size Comb Support</h1>
<p>Size Comb keeps one size bath on this iPhone. Pull the wide comb across to write lines. Pull the other way to halve them. The fine comb writes nonpareil only after that. Only a nonpareil sheet can be lifted.</p>
