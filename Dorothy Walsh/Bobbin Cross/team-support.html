<h1>Bobbin Cross Support</h1>
<p>Bobbin Cross keeps one bobbin-lace row on this iPhone. Drag across the midline to twist the pair. Drag into the next empty pin to cross. Four ground pins close the row. A cloth pin can be pulled back; a ground pin cannot.</p>
